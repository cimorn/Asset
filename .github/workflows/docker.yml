name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install desktop dependencies
        run: npm --prefix ../app ci --ignore-scripts && npm --prefix ../app/desktop ci --ignore-scripts
      - name: Verify desktop
        run: npm --prefix ../app run typecheck && npm --prefix ../app run build && npm --prefix ../app test

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image tags
        id: image
        shell: bash
        run: |
          # Keep the existing image address for deployed clients.
          image="ghcr.io/cimorn/assetmanager"
          {
            echo 'tags<<TAGS'
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "${image}:latest"; fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "${image}:${GITHUB_REF_NAME#v}"; fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 + arm64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./website
          file: website/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image digest: \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Docker host: pull the new image and recreate only the asset service. Keep MongoDB and private environment files.' >> "$GITHUB_STEP_SUMMARY"
